# Configurando a conex\u00e3o com MongoDB enquanto reposit\u00f3rio de dados
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://alepatrao:shalom@cluster0.hnp7z.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0}
spring.data.mongodb.database=thindesk
spring.data.mongodb.auto-index-creation=true
spring.mongodb.embedded.data=file:src/main/resources/chamados.json
# Definindo usu\u00e1rio e senha padr\u00e3o para autentica\u00e7\u00e3o de usu\u00e1rio do sistema
spring.security.user.name=admin
spring.security.user.password=thindesk

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG

# Dashboard administrativo
# Chamados pendentes h\u00e1 mais horas que este valor aparecem como "fora do prazo"
thindesk.dashboard.prazo-horas=48
# Insere chamados fict\u00edcios quando a cole\u00e7\u00e3o tem menos de 20 registros (use apenas em base de testes)
thindesk.seed.enabled=${THINDESK_SEED:false}
